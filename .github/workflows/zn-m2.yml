name: ZN-M2-NoWiFi-USB

# ZN-M2 NoWiFi + USB 编译主入口
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 自动编译：当 Auto-Clean 运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出最终配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-NO-ZN-M2]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    # 调用公共编译核心
    uses: ./.github/workflows/WRT-CORE2.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: aurora
      WRT_NAME: ZN-M2-NoWiFi-USB
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}
