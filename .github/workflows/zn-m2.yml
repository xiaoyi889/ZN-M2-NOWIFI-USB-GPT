name: ZN-M2-NoWiFi-USB

# ZN-M2 NoWiFi 双版本编译主入口
# 一次工作流同时调用两个独立编译核心：
#   1. WRT-CORE.yml  -> ZN-M2 + NoWiFi
#   2. WRT-CORE2.yml -> ZN-M2 + NoWiFi + USB

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 自动编译：当 Auto-Clean 运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行符隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出最终配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  nowifi:
    name: ZN-M2 NoWiFi
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-NO-ZN-M2
      WRT_THEME: aurora
      WRT_NAME: ZN-M2-NoWiFi
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}

  nowifi-usb:
    name: ZN-M2 NoWiFi + USB
    uses: ./.github/workflows/WRT-CORE2.yml
    with:
      WRT_CONFIG: IPQ60XX-WIFI-NO-ZN-M2
      WRT_THEME: aurora
      WRT_NAME: ZN-M2-NoWiFi-USB
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST}}